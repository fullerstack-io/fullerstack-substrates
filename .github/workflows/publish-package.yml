name: Publish Package to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26-ea'
          distribution: 'temurin'
          cache: maven

      # Clone Humainary APIs OUTSIDE the workspace so the editorconfig
      # plugin (and any other workspace-walking tool) does not descend
      # into upstream's source tree. The artifacts land in ~/.m2 and are
      # picked up by our build from there.
      - name: Clone and install Humainary Substrates API
        run: |
          git clone https://github.com/humainary-io/substrates-api-java.git "$RUNNER_TEMP/substrates-api-java"
          mvn -f "$RUNNER_TEMP/substrates-api-java/pom.xml" clean install -DskipTests

      - name: Clone and install Humainary Serventis API
        run: |
          git clone https://github.com/humainary-io/serventis-api-java.git "$RUNNER_TEMP/serventis-api-java"
          mvn -f "$RUNNER_TEMP/serventis-api-java/pom.xml" clean install -DskipTests

      - name: Build and publish to GitHub Packages
        run: mvn -B clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
