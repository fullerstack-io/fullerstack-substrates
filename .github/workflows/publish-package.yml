name: Publish Package to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - '**'
  workflow_dispatch:

env:
  # The Humainary release this provider is built and measured against. Every upstream
  # repository is cloned at THIS tag — never at HEAD, which moves ahead of the version
  # in pom.xml and has broken this workflow before. Bump it with the two
  # *-api.version properties in pom.xml; the guard step below fails if they diverge.
  HUMAINARY_TAG: '3.1.2'
  # Upstream publishes each release as a squashed commit on main and does not tag it;
  # main has since moved to 3.3.0. Each repository is fetched at the commit the family
  # was upgraded against on 2026-09-14, so a later upstream commit cannot change what
  # this provider is built and measured against. Bump these with HUMAINARY_TAG.
  HUMAINARY_SPECS_SHA: '5ffbd941691fc71b36f76a0f380ec1b3744cb793'
  HUMAINARY_SUBSTRATES_SHA: '366a7d5f9c488ae776ff041702b7c21e8ceea5cf'
  HUMAINARY_SERVENTIS_SHA: '64f0b9a39399b06d23ccd69238949b30a9fc9f90'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 26
        uses: actions/setup-java@v4
        with:
          java-version: '26-ea'
          distribution: 'temurin'
          cache: maven

      - name: Check the pinned tag matches pom.xml
        run: |
          for prop in substrates-api serventis-api; do
            v=$(sed -n "s|.*<${prop}\.version>\(.*\)</${prop}\.version>.*|\1|p" pom.xml)
            if [ "$v" != "$HUMAINARY_TAG" ]; then
              echo "::error::pom.xml <${prop}.version> is '$v' but HUMAINARY_TAG is '$HUMAINARY_TAG'"
              exit 1
            fi
          done
          echo "pinned at $HUMAINARY_TAG"

      # Clone the Humainary repositories OUTSIDE the workspace so the editorconfig
      # plugin (and any other workspace-walking tool) does not descend into upstream's
      # source tree. The artifacts land in ~/.m2 and are picked up by our build there.
      #
      # specs-api-java installs FIRST: since 3.0.2 both APIs depend on it for the
      # @SpecDoc / @SpecRef traceability annotations. Omitting it is what failed every
      # run from 2026-08-26 with
      #   Could not find artifact io.humainary.specs:humainary-specs-api:jar:3.0.2
      - name: Clone and install the Humainary APIs
        run: |
          set -euo pipefail
          # Pinned commits, in dependency order: specs first (both APIs declare it as provided).
          for pair in "specs-api-java=$HUMAINARY_SPECS_SHA" \
                      "substrates-api-java=$HUMAINARY_SUBSTRATES_SHA" \
                      "serventis-api-java=$HUMAINARY_SERVENTIS_SHA"; do
            repo="${pair%%=*}"; sha="${pair#*=}"
            echo "==> $repo @ $HUMAINARY_TAG ($sha)"
            dir="$RUNNER_TEMP/$repo"
            git init -q "$dir"
            git -C "$dir" remote add origin "https://github.com/humainary-io/$repo.git"
            git -C "$dir" fetch -q --depth 1 origin "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
            # Upstream versions through a <revision> property (${revision} in <version>).
            v=$(sed -n 's|.*<revision>\(.*\)</revision>.*|\1|p' "$dir/pom.xml" | head -1)
            if [ "$v" != "$HUMAINARY_TAG" ]; then
              echo "::error::$repo at $sha declares revision '$v', not $HUMAINARY_TAG"
              exit 1
            fi
            mvn -B -f "$dir/pom.xml" clean install -DskipTests
          done

      - name: Build and publish to GitHub Packages
        run: mvn -B clean deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
